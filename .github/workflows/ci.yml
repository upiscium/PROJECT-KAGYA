name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export immutable build provenance
        run: |
          echo "KAGYA_SOURCE_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "KAGYA_SOURCE_TREE_HASH=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "KAGYA_BUILD_ID=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Deterministic backend tests (real-model suite excluded)
        run: uv run pytest tests/ -v -m "not real_model"
      - name: Ruff
        run: uv run ruff check kagya tests
      - name: Mypy
        run: uv run mypy kagya
      - name: Config validation
        run: uv run python -m kagya.config.check config.yaml
      - name: Schema alignment
        run: uv run pytest tests/test_frontend_api_schema_sync.py -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Frontend build
        run: npm run build
