[project]
name = "project-kagya"
version = "0.1.0"
description = "A standard Python project managed by uv and Nix"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.13.0",
    "bitsandbytes>=0.49.2",
    "chromadb>=1.5.5",
    "peft>=0.18.1",
    "sentence-transformers>=5.3.0",
    "transformers>=5.4.0",
]

[project.scripts]
project-kagya = "project_kagya.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
