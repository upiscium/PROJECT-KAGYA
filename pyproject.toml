[project]
name = "project-kagya"
version = "0.1.0"
description = "Subjective AI architecture with prediction error, emotion, memory, and sleep-time learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate",
    "bitsandbytes",
    "chromadb",
    "datasets",
    "fastapi",
    "numpy",
    "packaging",
    "peft",
    "pillow",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "pyyaml",
    "rich",
    "sentence-transformers",
    "torch",
    "torchvision",
    "transformers>=5.14.1",
    "trl",
    "uvicorn",
]

[project.scripts]
kagya-worker = "kagya.training.worker_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kagya"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "types-PyYAML",
]
