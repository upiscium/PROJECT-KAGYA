project:
  name: PROJECT-KAGYA
  environment: development

model:
  primary_id: google/gemma-4-12B-it
  fallback_id: google/gemma-4-E2B-it
  provider: dummy
  device: auto
  dtype: auto
  load_in_4bit: true
  revision: main
  processor_revision: main
  fallback_revision: main

generation:
  max_new_tokens: 128
  temperature: 0.3
  top_p: 0.9
  do_sample: false
  repetition_penalty: 1.15
  no_repeat_ngram_size: 6

emotion:
  baseline_surprisal: 1.0
  high_emotion_threshold: 0.75
  decay_rate: 0.05
  appraisal_response_rate: 0.4
  resting_valence: 0.0
  resting_arousal: 0.0
  valence_recovery_rate: 0.01
  arousal_recovery_rate: 0.02

appraisal:
  initial_loss_scale: 0.5
  minimum_loss_scale: 0.1
  default_controllability: 0.6
  default_certainty: 0.7
  timer_enabled: false
  timer_interval_seconds: 60.0

memory:
  persist_directory: .kagya/chroma
  db1_collection: hippocampus
  db2_collection: cortex
  db1_top_k: 5
  db2_top_k: 5
  embedding_model_id: sentence-transformers/all-MiniLM-L6-v2
  default_record_type: episodic

working_memory:
  item_capacity: 32
  token_capacity: 2048

values:
  max_update_per_event: 0.05
  max_total_update_per_event: 0.1
  seeds:
    - value_id: care
      name: Care
      weight: 0.8
      confidence: 0.8
      stability: 0.8
      source: config
      origin: persona:default
      allowed_update_rate: 0.05
    - value_id: honesty
      name: Honesty
      weight: 0.8
      confidence: 0.8
      stability: 0.85
      source: config
      origin: persona:default
      allowed_update_rate: 0.04
  conflicts:
    - left_value_id: care
      right_value_id: honesty
      name: compassionate-honesty

sleep:
  enabled: true
  dream_dataset_path: .kagya/dreams/dream_dataset.jsonl
  min_emotion_score: 0.75
  max_episodes_per_cycle: 100
  job_registry_path: .kagya/training_jobs.json
  training_artifact_directory: .kagya/training_artifacts
  artifact_retention_days: 30

qlora:
  output_dir: .kagya/adapters
  dry_run: true
  r: 16
  alpha: 32
  lora_alpha: 32
  dropout: 0.05
  lora_dropout: 0.05
  learning_rate: 0.0002
  num_train_epochs: 1
  max_steps: 10
  gradient_checkpointing: true
  gradient_accumulation_steps: 8
  max_sequence_length: 512
  optimizer: paged_adamw_8bit
  seed: 42
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  resume_policy: never

adapter_registry:
  path: .kagya/adapter_registry.json
  eval_result_dir: .kagya/eval_results
  eval_sets:
    - .kagya/eval_sets/default.json
  trial_threshold: 0.8
  reject_threshold: 0.4
  allowed_states:
    - candidate
    - trial_active
    - approved
    - active
    - rejected
    - archived
  manual_approval_required: true
  holdout_regression_tolerance: 0.0
  max_identity_drift: 0.1
  max_value_drift: 0.1
  max_behavior_drift: 0.1
  canary_failure_limit: 1

tools:
  path: .kagya/tool_registry.json
  audit_path: .kagya/tool_audit.jsonl

agent_journal:
  path: .kagya/agent_journal.jsonl
  max_bytes: 10485760
  retained_files: 3

# Authoritative patches are private state, unlike the operator-safe journal.
agent_state_wal:
  path: .kagya/private/agent_state_wal.jsonl

autonomy:
  enabled: true
  poll_interval_seconds: 1.0
  reevaluation_interval_seconds: 300.0
  max_events_per_cycle: 8
  max_inferences_per_cycle: 1
  max_wall_seconds_per_cycle: 5.0

observability:
  enabled: true
  metrics_path: .kagya/operational_metrics.json
  traces_path: .kagya/operational_traces.json
  max_series: 512
  max_traces: 1000

api:
  host: 127.0.0.1
  port: 8000
  admin_token_env: KAGYA_ADMIN_TOKEN
  # Optional identity/role sessions are disabled for the private token-only default.
  admin_auth:
    enabled: false
    actor_header: X-KAGYA-Actor
    role_header: X-KAGYA-Role
    reauthenticated_at_header: X-KAGYA-Reauthenticated-At
    session_cookie_name: kagya_admin_session
    csrf_cookie_name: kagya_admin_csrf
    csrf_header: X-KAGYA-CSRF-Token
    reauthentication_max_age_seconds: 300
    reauthentication_paths:
      - /api/state/restore
      - /api/state/reset
      - /api/state/restore/*
      - /api/sleep/jobs
      - /api/sleep/jobs/*
      - /api/sleep/cleanup
      - /api/adapters/rollback
      - /api/adapters/*/activate
      - /api/values/reset
      - /api/self-model/rollback
    allow_loopback_recovery: true
  cors_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000

frontend:
  base_url: http://localhost:3000
  api_base_url: http://127.0.0.1:8000

deployment:
  mode: standalone
  node:
    id: kagya-standalone-01
    role: all
    expected_hostname: null
    enforce_hostname_match: false
  training:
    backend: local
