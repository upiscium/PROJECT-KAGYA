[runtime]
backend = "dummy"
input_text = "hello"
initial_valence = 0.0
initial_arousal = 0.0

[model]
model_name = "Qwen/Qwen2.5-1.5B-Instruct"
adapter_path = ""
load_in_4bit = true

[memory]
top_k = 3

[emotion]
optimal_loss = 2.5
adaptation_rate = 0.15

[sleep]
high_arousal_threshold = 0.7
high_valence_threshold = 0.6
dream_dataset_path = "dream_dataset.jsonl"

[logging]
level = "INFO"
file_path = "project-kagya.log"

[paths]
chroma_dir = ".kagya/chroma"
adapter_dir = ".kagya/adapters"
log_dir = ".kagya/logs"
sleep_dir = ".kagya/sleep"
